<!DOCTYPE html>
<html>
<head>
    <style>
        #pantalla {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .cubo {
            width: 40px;
            height: 40px;
            background: cyan;
        }
    </style>
</head>

<body>

<button onclick="crearCubo()">Añadir cubo</button>

<div id="pantalla"></div>

<script>
function crearCubo() {
    let cubo = document.createElement("div");
    cubo.className = "cubo";
    document.getElementById("pantalla").appendChild(cubo);
}
</script>

</body>
</html>
